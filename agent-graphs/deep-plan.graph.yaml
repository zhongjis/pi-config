description: >-
  Turn a Caller-approved brief for a large feature into one decision-complete
  implementation plan: gather evidence, draft typed todos, run gap analysis,
  render the Markdown plan, and optionally review it with two independent
  reviewers.

inputSchema:
  type: object
  additionalProperties: false
  required: [request, brief, requiredCoverage, reviewRequired]
  properties:
    request: { type: string, pattern: '\S' }
    brief:
      type: object
      additionalProperties: false
      required: [goal, components, scopeIn, scopeOut, decisions, defaults, testStrategy]
      properties:
        goal: { type: string, pattern: '\S' }
        components:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [id, outcome]
            properties:
              id: { type: string, pattern: '^C[1-6]$' }
              outcome: { type: string, pattern: '\S' }
        scopeIn: { type: array, items: { type: string, pattern: '\S' } }
        scopeOut: { type: array, items: { type: string, pattern: '\S' } }
        decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [question, choice, why]
            properties: { question: { type: string, pattern: '\S' }, choice: { type: string, pattern: '\S' }, why: { type: string, pattern: '\S' } }
        defaults:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [choice, rationale, reversible]
            properties: { choice: { type: string, pattern: '\S' }, rationale: { type: string, pattern: '\S' }, reversible: { type: boolean } }
        testStrategy: { enum: [TDD, tests-after, none] }
    requiredCoverage:
      type: array
      minItems: 1
      maxItems: 12
      items:
        type: object
        additionalProperties: false
        required: [id, criterion]
        properties: { id: { type: string, pattern: '\S' }, criterion: { type: string, pattern: '\S' } }
    reviewRequired: { type: boolean }

nodes:
  gather:
    type: graph
    name: Gather evidence
    graph: context-gather
    input:
      request: { path: $.request }
      requiredCoverage: { path: $.requiredCoverage }

  draft:
    type: agent
    name: Draft typed plan
    agent: xuannv
    prompt: |
      Draft one decision-complete implementation plan. A worker who never saw the user conversation will execute it and must make zero judgment calls.

      Request: ${request}
      Approved brief (goal, components, scope, owner decisions, adopted defaults, test strategy): ${brief}
      Gathered evidence (answer, verified coverage, unknowns, evidence, conflicts): ${evidence}

      Rules:
      - Plan the entire request and approved scope. Never invent an MVP, phase, deferral, reduction, or adjacent expansion. Scope out guards against additions only.
      - Treat the brief's decisions and defaults as settled. Do not reopen them.
      - Verify paths, symbols, and patterns yourself before citing them. Cite each reference as path:line or a named pattern.
      - Give every must-have a stable ID (M1, M2, ...) tied to one brief component. List explicit must-nots.
      - Size each todo as the coarsest cohesive packet that is independently verifiable and fits one worker run. Keep implementation and its tests in one todo. Split only for an independent outcome, context, or verification boundary.
      - Group todos into waves by dependency and write-path boundaries. blockedBy lists todo IDs only.
      - Worker fit is advisory: cangjie for standalone docs, guangguang for mechanical single-file work, jintong as the default for non-UI work, juling for substantial cross-module work or elevated reasoning, yunu for frontend UI.
      - Every todo carries agent-executable acceptance and both a happy and a failure QA scenario, each with the exact invocation and the evidence it leaves. Follow the brief's test strategy.
      - Record unresolved evidence unknowns as risks, not guesses.
      Return JSON only.
    input:
      request: { path: $.request }
      brief: { path: $.brief }
      evidence: { node: gather, path: $ }
    outputSchema:
      type: object
      additionalProperties: false
      required: [mustHaves, mustNots, todos, verificationStrategy, risks]
      properties:
        mustHaves:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, componentId, text]
            properties:
              id: { type: string, pattern: '^M[0-9]+$' }
              componentId: { type: string, pattern: '^C[1-6]$' }
              text: { type: string, pattern: '\S' }
        mustNots: { type: array, items: { type: string, pattern: '\S' } }
        todos:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, title, objective, artifacts, workerFit, escalationTriggers, mustHaveIds, wave, blockedBy, whatToDo, mustNotDo, references, acceptance, qa, commit]
            properties:
              id: { type: string, pattern: '^T[0-9]+$' }
              title: { type: string, pattern: '\S' }
              objective: { type: string, pattern: '\S' }
              artifacts: { type: array, minItems: 1, items: { type: string, pattern: '\S' } }
              workerFit: { enum: [cangjie, guangguang, jintong, juling, yunu] }
              escalationTriggers: { type: array, items: { type: string, pattern: '\S' } }
              mustHaveIds: { type: array, minItems: 1, uniqueItems: true, items: { type: string, pattern: '^M[0-9]+$' } }
              wave: { type: integer, minimum: 1 }
              blockedBy: { type: array, uniqueItems: true, items: { type: string, pattern: '^T[0-9]+$' } }
              whatToDo: { type: string, pattern: '\S' }
              mustNotDo: { type: array, items: { type: string, pattern: '\S' } }
              references: { type: array, minItems: 1, items: { type: string, pattern: '\S' } }
              acceptance: { type: array, minItems: 1, items: { type: string, pattern: '\S' } }
              qa:
                type: object
                additionalProperties: false
                required: [happy, failure]
                properties:
                  happy: &scenario
                    type: object
                    additionalProperties: false
                    required: [scenario, invocation, evidence]
                    properties: { scenario: { type: string, pattern: '\S' }, invocation: { type: string, pattern: '\S' }, evidence: { type: string, pattern: '\S' } }
                  failure: *scenario
              commit: { type: string, pattern: '\S' }
        verificationStrategy: { type: string, pattern: '\S' }
        risks: { type: array, items: { type: string, pattern: '\S' } }

  gap:
    type: agent
    name: Gap analysis
    agent: direnjie
    prompt: |
      Run gap analysis on this draft implementation plan before it is finalized. Verify claims against the repository; do not trust the draft.

      Request: ${request}
      Approved brief: ${brief}
      Evidence unknowns: ${unknowns}
      Draft plan: ${plan}

      Blocking findings are defects an executor would hit:
      - contradictions, missing constraints, or unvalidated assumptions;
      - scope creep beyond the brief, or scope reduced, phased, or deferred;
      - a must-have with no todo, or a todo serving a must-not;
      - blockedBy naming an unknown todo, or a wave that runs before its blockers;
      - wrong paths or symbols, missing acceptance, or QA without an exact invocation;
      - any judgment call left to the executor.
      Also challenge the highest-leverage adopted default: report it as blocking only when evidence shows it breaks the request. Never propose reducing, phasing, or expanding scope.
      Put everything else in advisory. Give each finding its target (todo ID, must-have ID, or "plan"), the issue, and a concrete fix.
      Return JSON only.
    input:
      request: { path: $.request }
      brief: { path: $.brief }
      unknowns: { node: gather, path: $.unknowns }
      plan: { node: draft, path: $ }
    outputSchema:
      type: object
      additionalProperties: false
      required: [blocking, advisory]
      properties:
        blocking: { type: array, items: &finding { type: object, additionalProperties: false, required: [target, issue, fix], properties: { target: { type: string, pattern: '\S' }, issue: { type: string, pattern: '\S' }, fix: { type: string, pattern: '\S' } } } }
        advisory: { type: array, items: *finding }

  refine:
    type: agent
    name: Finalize plan
    agent: xuannv
    prompt: |
      Finalize the implementation plan as Markdown.

      Request: ${request}
      Approved brief: ${brief}
      Draft plan: ${plan}
      Gap findings: ${gap}

      Apply every blocking fix. Adopt an advisory fix only when it stays inside the brief's scope. Verify any new reference in the repository. A blocking finding that only the user can settle goes into unresolved and under "Open questions" in the TL;DR; do not guess it.

      Write these eight headers once each, in this order:
      ## TL;DR (For humans)
      ## Scope
      ## Verification strategy
      ## Execution strategy
      ## Todos
      ## Final verification wave
      ## Commit strategy
      ## Success criteria

      - TL;DR: goal, approach, waves at a glance, "Decisions I made for you" copied from the brief's defaults with rationale and reversibility, and open questions if any.
      - Scope: in, out, must-haves with IDs, must-nots.
      - Execution strategy: waves and a dependency matrix listing every todo once with depends-on, blocks, and parallel peers.
      - Todos: one column-zero row per todo, numbered from 1 in draft order: `- [ ] N. <title>`. Under each row, indented: Objective, Artifacts, Worker fit (advisory), Escalation triggers, Must-have IDs, What to do / Must NOT do, Parallelization (wave, blocked by, blocks), References, Acceptance criteria, QA scenarios (happy and failure, each with invocation and evidence), Commit.
      - Final verification wave: exactly these rows after all todos, run after every todo completes, all must approve:
        `- [ ] F1. Plan compliance audit` (taishang)
        `- [ ] F2. Code quality review` (orchestrator: full diff review and integration checks)
        `- [ ] F3. Real manual QA` (orchestrator: drive the changed surfaces)
        `- [ ] F4. Scope fidelity` (direnjie)
      - Success criteria: an executable done condition for every must-have ID.
      No placeholders or template text may remain.
      Set outcome to succeeded when unresolved is empty; otherwise partial with a reason naming the open questions.
      Return JSON only.
    input:
      request: { path: $.request }
      brief: { path: $.brief }
      plan: { node: draft, path: $ }
      gap: { node: gap, path: $ }
    outputSchema:
      type: object
      additionalProperties: false
      required: [markdown, unresolved, outcome]
      properties:
        markdown:
          type: string
          pattern: '## TL;DR \(For humans\)\n[\s\S]*\n## Scope\n[\s\S]*\n## Verification strategy\n[\s\S]*\n## Execution strategy\n[\s\S]*\n## Todos\n(?:[\s\S]*\n)?- \[ \] 1\. [\s\S]*\n## Final verification wave\n(?:[\s\S]*\n)?- \[ \] F1\. [\s\S]*\n- \[ \] F2\. [\s\S]*\n- \[ \] F3\. [\s\S]*\n- \[ \] F4\. [\s\S]*\n## Commit strategy\n[\s\S]*\n## Success criteria\n'
        unresolved: { type: array, items: { type: string, pattern: '\S' } }
        outcome:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { enum: [succeeded, partial] }
            reason: { type: string, pattern: '\S' }
          allOf:
            - if: { properties: { status: { const: succeeded } }, required: [status] }
              then: { not: { required: [reason] } }
            - if: { properties: { status: { const: partial } }, required: [status] }
              then: { required: [reason] }
      allOf:
        - if: { properties: { unresolved: { minItems: 1 } }, required: [unresolved] }
          then: { properties: { outcome: { properties: { status: { const: partial } } } } }
          else: { properties: { outcome: { properties: { status: { const: succeeded } } } } }

  reviewYanluo:
    type: agent
    name: Review plan (Yanluo)
    agent: yanluo
    prompt: &reviewPrompt |
      Review this finalized implementation plan for execution readiness. Verify references against the repository.

      Request: ${request}
      Approved brief: ${brief}
      Plan:
      ${plan}

      Reject only for blockers: a todo an executor cannot carry out without guessing, missing or non-executable acceptance or QA, references that do not exist, a must-have without coverage, or scope that differs from the brief. Put everything else in suggestions.
      Approve with no blockers, or reject with at least one blocker giving its target, issue, and concrete fix.
      Return JSON only.
    input: &reviewInput
      request: { path: $.request }
      brief: { path: $.brief }
      plan: { node: refine, path: $.markdown }
    outputSchema: &reviewSchema
      type: object
      additionalProperties: false
      required: [verdict, blockers, suggestions]
      properties:
        verdict: { enum: [approve, reject] }
        blockers: { type: array, items: *finding }
        suggestions: { type: array, items: { type: string, pattern: '\S' } }
      allOf:
        - if: { properties: { verdict: { const: approve } }, required: [verdict] }
          then: { properties: { blockers: { maxItems: 0 } } }
          else: { properties: { blockers: { minItems: 1 } } }

  reviewTaishang:
    type: agent
    name: Review plan (Taishang)
    agent: taishang
    prompt: *reviewPrompt
    input: *reviewInput
    outputSchema: *reviewSchema

edges:
  - { from: gather, to: draft }
  - { from: draft, to: gap }
  - { from: gap, to: refine }
  - { from: refine, to: reviewYanluo, when: { eq: [{ path: $.reviewRequired }, true] } }
  - { from: refine, to: reviewTaishang, when: { eq: [{ path: $.reviewRequired }, true] } }

outputs:
  $report: { node: refine, path: $.markdown }
  $agentGraphOutcome: { node: refine, path: $.outcome }
  unresolved: { node: refine, path: $.unresolved }
  gap: { node: gap, path: $ }
  evidenceUnknowns: { node: gather, path: $.unknowns }
  reviewYanluo: { node: reviewYanluo, path: $ }
  reviewTaishang: { node: reviewTaishang, path: $ }
